server:
  port: 9001
  tomcat:
    threads:
      max: 200  # 设定处理客户请求的线程的最大数目，决定了服务器可以同时响应客户请求的数，默认200
      min-spare: 50 # 初始化线程数，最小空闲线程数，默认10
    accept-count: 10 # 等待队列长度

# 应用配置
app:
  config:
    # 版本，方便通过接口版本升级
    api-version: v1
    # 跨域，开发阶段可以设置为 * 不限制
    cross-origin: '*'

# 线程池配置
thread:
  pool:
    executor:
      config:
        core-pool-size: 20
        max-pool-size: 50
        keep-alive-time: 5000
        block-queue-size: 5000
        policy: CallerRunsPolicy

# ShardingSphere 分库分表配置
spring:
  shardingsphere:
    # 数据源配置
    datasource:
      names: ds0,ds1,ds2
      # 默认数据源（主库）
      ds0:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        jdbc-url: jdbc:mysql://127.0.0.1:13306/big_market?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=UTC&useSSL=true
        username: root
        password: Hgy@123
        hikari:
          pool-name: Retail_HikariCP_DS0
          minimum-idle: 15
          idle-timeout: 180000
          maximum-pool-size: 25
          auto-commit: true
          max-lifetime: 1800000
          connection-timeout: 30000
          connection-test-query: SELECT 1
      # 分库1
      ds1:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        jdbc-url: jdbc:mysql://127.0.0.1:13306/big_market_01?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=UTC&useSSL=true
        username: root
        password: 123456
        hikari:
          pool-name: Retail_HikariCP_DS1
          minimum-idle: 15
          idle-timeout: 180000
          maximum-pool-size: 25
          auto-commit: true
          max-lifetime: 1800000
          connection-timeout: 30000
          connection-test-query: SELECT 1
      # 分库2
      ds2:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        jdbc-url: jdbc:mysql://127.0.0.1:13306/big_market_02?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=UTC&useSSL=true
        username: root
        password: 123456
        hikari:
          pool-name: Retail_HikariCP_DS2
          minimum-idle: 15
          idle-timeout: 180000
          maximum-pool-size: 25
          auto-commit: true
          max-lifetime: 1800000
          connection-timeout: 30000
          connection-test-query: SELECT 1

    # 分片规则配置
    rules:
      sharding:
        # 分库策略
        default-database-strategy:
          standard:
            sharding-column: userId
            sharding-algorithm-name: database-inline
        tables:
          raffle_activity_account:
            actual-data-nodes: ds$->{1..2}.raffle_activity_account_$->{0..3}
            table-strategy:
              standard:
                sharding-column: userId
                sharding-algorithm-name: table-inline
          raffle_activity_account_month:
            actual-data-nodes: ds$->{1..2}.raffle_activity_account_month_$->{0..3}
            table-strategy:
              standard:
                sharding-column: userId
                sharding-algorithm-name: table-inline
          raffle_activity_account_day:
            actual-data-nodes: ds$->{1..2}.raffle_activity_account_day_$->{0..3}
            table-strategy:
              standard:
                sharding-column: userId
                sharding-algorithm-name: table-inline
          raffle_activity_order:
            actual-data-nodes: ds$->{1..2}.raffle_activity_order_$->{0..3}
            table-strategy:
              standard:
                sharding-column: userId
                sharding-algorithm-name: table-inline
          user_raffle_order:
            actual-data-nodes: ds$->{1..2}.user_raffle_order_$->{0..3}
            table-strategy:
              standard:
                sharding-column: userId
                sharding-algorithm-name: table-inline

        # 分片算法配置
        sharding-algorithms:
          database-inline:
            type: INLINE
            props:
              algorithm-expression: ds$->{userId % 2 + 1}
          table-inline:
            type: INLINE
            props:
              algorithm-expression: $->{table}_$->{userId % 4}

    # 属性配置
    props:
      sql-show: true # 显示SQL日志

  # Spring 配置： RabbitMq
  rabbitmq:
    addresses: 127.0.0.1
    port: 5672
    username: admin
    password: admin
    listener:
      simple:
        prefetch: 1 # 每次投递N个消息，消费完在投递N个
      topic:
        activity_sku_stock_zero: activity_sku_stock_zero

# Redis
redis:
  sdk:
    config:
      host: 127.0.0.1
      port: 16379
      pool-size: 10
      min-idle-size: 5
      idle-timeout: 30000
      connect-timeout: 5000
      retry-attempts: 3
      retry-interval: 1000
      ping-interval: 60000
      keep-alive: true
      password: Hgy@123

mybatis:
  mapper-locations: classpath:/mybatis/mapper/*.xml
  config-location:  classpath:/mybatis/config/mybatis-config.xml

# 日志
logging:
  level:
    root: info
  config: classpath:logback-spring.xml